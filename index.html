<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avance y OL — PASOS UANDES</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --salmon: #D8162D; --salmon-light: #fdeaea; --salmon-mid: #ED6B6A;
    --green: #93C049; --amber: #F28E35; --teal: #25AFC4; --blue: #79C3A1;
    --u1: #25AFC4; --u2: #93C049; --u3: #F28E35; --u4: #D8162D;
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efec;
    --text: #1a1a1a; --text2: #666; --text3: #999;
    --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.2);
    --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --bg2: #242424; --bg3: #2e2e2e;
      --text: #f0f0f0; --text2: #aaa; --text3: #666;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --salmon-light: #3a1a16;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .top-bar h1 { font-size: 20px; font-weight: 600; color: var(--teal); display: flex; align-items: center; gap: 8px; }
  .top-bar h1 svg { width: 22px; height: 22px; }
  .update-time { font-size: 12px; color: var(--text3); }
  .filters { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 20px; }
  .fgroup { display: flex; flex-direction: column; gap: 4px; }
  .fgroup label { font-size: 11px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }
  .fgroup select { font-size: 13px; padding: 6px 10px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); min-width: 150px; cursor: pointer; font-family: inherit; }
  .fgroup select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .ms-wrap { position: relative; }
  .ms-box { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 10px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); min-width: 200px; cursor: pointer; user-select: none; }
  .ms-box:hover { border-color: var(--teal); }
  .ms-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 999; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); box-shadow: 0 4px 16px rgba(0,0,0,0.12); min-width: 260px; max-height: 300px; overflow-y: auto; padding: 6px 0; }
  .ms-search { padding: 6px 14px 2px; }
  .ms-search input { width: 100%; font-size: 12px; padding: 5px 8px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); font-family: inherit; }
  .ms-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13px; color: var(--text); cursor: pointer; }
  .ms-item:hover { background: var(--bg2); }
  .ms-item input[type=checkbox] { cursor: pointer; accent-color: var(--salmon); }
  .ms-footer { padding: 8px 14px; border-top: 0.5px solid var(--border); margin-top: 4px; }
  .ms-apply { width: 100%; padding: 7px; border-radius: var(--radius); border: none; background: var(--teal); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn { font-size: 12px; padding: 6px 14px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text2); cursor: pointer; font-family: inherit; transition: background 0.15s; align-self: flex-end; }
  .btn:hover { background: var(--bg3); color: var(--text); }
  .btn.primary { background: var(--salmon-light); color: var(--salmon); border-color: var(--salmon-mid); }
  .btn.primary:hover { background: var(--green); color: #fff; border-color: var(--green); }
  .section-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; margin-top: 4px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; }
  .kpi.accent { background: var(--salmon-light); }
  .kpi .lbl { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .kpi .val { font-size: 28px; font-weight: 600; line-height: 1; }
  .kpi .sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .prog-track { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .prog-fill { height: 6px; border-radius: 3px; }
  .prog-lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); margin-top: 3px; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
  .card h3 { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
  .nivel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .nivel-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .nivel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .nivel-name { font-size: 13px; font-weight: 500; }
  .nivel-n { font-size: 11px; color: var(--text3); }
  .nivel-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text2); margin-top: 5px; }
  .nivel-row strong { font-size: 13px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 10px; border-bottom: 0.5px solid var(--border); text-align: left; white-space: nowrap; }
  .tbl th:not(:first-child) { text-align: center; }
  .tbl td { padding: 8px 10px; border-bottom: 0.5px solid var(--border); }
  .tbl td:not(:first-child) { text-align: center; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: var(--bg2); }
  .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 500; }
  .pill-g { background: #e8f5d6; color: #3a6a08; }
  .pill-t { background: #ddf3f8; color: #0d6e85; }
  .pill-a { background: #fff0d6; color: #8a4a00; }
  .pill-r { background: #fde8e8; color: #a01020; }
  @media (prefers-color-scheme: dark) {
    .pill-g{background:#2a3d1a;color:#a8d860} .pill-t{background:#0f2a33;color:#5dd9f0}
    .pill-a{background:#3a2a00;color:#f9b875} .pill-r{background:#3a1010;color:#ED6B6A}
  }
  .mini-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .mini-bar-track { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .mini-bar-fill { height: 6px; border-radius: 3px; }
  .mini-bar-pct { font-size: 11px; color: var(--text2); min-width: 32px; }
  .loading-wrap { text-align: center; padding: 60px 20px; color: var(--text2); }
  .loading-wrap p { font-size: 15px; margin-bottom: 16px; }
  .spinner { display: inline-flex; gap: 6px; }
  .spinner span { width: 9px; height: 9px; border-radius: 50%; background: var(--border2); animation: pulse 1.2s infinite; }
  .spinner span:nth-child(2){animation-delay:.2s} .spinner span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .error-wrap { background:#fde8e8; border:1px solid #f5a0a0; border-radius:var(--radius-lg); padding:20px; color:#921a1a; margin-bottom:20px; font-size:13px; line-height:1.6; }
  .error-wrap strong { display:block; font-size:15px; margin-bottom:8px; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--text2); margin-bottom:10px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .legend .sq { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
  .semaforo-legend { display:flex; gap:14px; font-size:11px; color:var(--text2); margin-bottom:14px; flex-wrap:wrap; }
  .semaforo-legend span { display:flex; align-items:center; gap:5px; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .charts-2col { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
  @media(max-width:640px){.charts-2col{grid-template-columns:1fr}}
  .logro-charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17V11M12 17V7M16 17V13"/></svg>
      Avance y OL — PASOS UANDES
    </h1>
    <span class="update-time" id="updateTime">—</span>
  </div>

  <div class="filters">
    <div class="fgroup ms-wrap">
      <label>Colegio</label>
      <div class="ms-box" id="msBox" onclick="toggleMenu(event)">
        <span id="msLabel">Todos los colegios</span>
        <span style="margin-left:auto;opacity:.5;font-size:11px">▼</span>
      </div>
      <div class="ms-menu" id="msMenu" style="display:none">
        <div class="ms-search"><input type="text" id="msSearch" placeholder="Buscar colegio..." oninput="filterMs(this.value)" onclick="event.stopPropagation()"></div>
        <label class="ms-item"><input type="checkbox" id="msAll" onchange="toggleAll(this)"> <em>Todos los colegios</em></label>
        <div id="msList"></div>
        <div class="ms-footer"><button class="ms-apply" onclick="applyFilter()">Aplicar filtro</button></div>
      </div>
    </div>
    <div class="fgroup">
      <label>Nivel</label>
      <select id="fNivel" onchange="render()"><option value="">Todos los niveles</option></select>
    </div>
    <button class="btn" onclick="resetFilters()">↺ Limpiar</button>
    <button class="btn primary" onclick="loadData()">⟳ Actualizar</button>
  </div>

  <div id="mainContent">
    <div class="loading-wrap">
      <p>Conectando con Google Sheets...</p>
      <div class="spinner"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc5nR49R8M2WycRNGUIjDN1MP1tRLM_bwCR-I8YmEeMR__FzdM3JpGE0xxrTjxwVvWyu5vL_wfG5VL/pub?gid=1361662823&single=true&output=csv';
const MAX_SES = 30;
// Sesiones máximas por unidad (30 total repartidas en 4 unidades)
// Se muestran apiladas — cada unidad aporta sus sesiones reales
const U_COLORS = { U1:'#25AFC4', U2:'#93C049', U3:'#F28E35', U4:'#D8162D' };
const U_LABELS = { U1:'Unidad 1', U2:'Unidad 2', U3:'Unidad 3', U4:'Unidad 4' };

let allData = [], charts = {};
let colegiosAll = [];

const NIVEL_ORDER = [
  'Medio Menor','Medio Mayor',
  'Pre Kínder','Pre Kinder','Pre-Kínder','Pre-Kinder','Prekínder','Prekinder',
  'Kínder','Kinder','Playgroup',
  '1° Básico','1º Básico','Primero Básico','1° Basico','Primero Basico',
  '2° Básico','2º Básico','Segundo Básico','2° Basico','Segundo Basico',
  '3° Básico','3º Básico','Tercero Básico','3° Basico','Tercero Basico',
  '4° Básico','4º Básico','Cuarto Básico','4° Basico','Cuarto Basico',
  '5° Básico','5º Básico','Quinto Básico','5° Basico','Quinto Basico',
  '6° Básico','6º Básico','Sexto Básico','6° Basico','Sexto Basico',
  '7° Básico','7º Básico','Séptimo Básico','7° Basico','Septimo Basico',
  '8° Básico','8º Básico','Octavo Básico','8° Basico','Octavo Basico',
  '1° Medio','1º Medio','Primero Medio',
  '2° Medio','2º Medio','Segundo Medio',
  '3° Medio','3º Medio','Tercero Medio',
  '4° Medio','4º Medio','Cuarto Medio'
];

function normStr(s){ return (s||'').toLowerCase().replace(/[íì]/g,'i').replace(/[áà]/g,'a').replace(/[éè]/g,'e').replace(/[óò]/g,'o').replace(/[úù]/g,'u').replace(/°|º/g,'').trim(); }
function nivelSort(a,b){ const ia=NIVEL_ORDER.findIndex(n=>normStr(n)===normStr(a)), ib=NIVEL_ORDER.findIndex(n=>normStr(n)===normStr(b)); if(ia===-1&&ib===-1)return a.localeCompare(b,'es'); if(ia===-1)return 1; if(ib===-1)return -1; return ia-ib; }

// Nombres canónicos "bonitos" para agrupar niveles sin importar cómo vengan escritos en el sheet
// (mayúsculas/minúsculas, con o sin tilde, con ° o º, etc. deben unificarse en UNA sola tarjeta)
const CANONICAL_NIVELES = [
  'Medio Menor','Medio Mayor','Playgroup','Pre Kínder','Kínder',
  '1° Básico','2° Básico','3° Básico','4° Básico','5° Básico','6° Básico','7° Básico','8° Básico',
  '1° Medio','2° Medio','3° Medio','4° Medio'
];
const CANONICAL_MAP = {};
CANONICAL_NIVELES.forEach(n => { CANONICAL_MAP[normStr(n)] = n; });
// Variantes adicionales que no se resuelven solo con normStr (Basico sin ° al inicio, escritas con palabras)
const EXTRA_VARIANTS = {
  'primero basico':'1° Básico','segundo basico':'2° Básico','tercero basico':'3° Básico','cuarto basico':'4° Básico',
  'quinto basico':'5° Básico','sexto basico':'6° Básico','septimo basico':'7° Básico','octavo basico':'8° Básico',
  'primero medio':'1° Medio','segundo medio':'2° Medio','tercero medio':'3° Medio','cuarto medio':'4° Medio',
  'prekinder':'Pre Kínder','pre kinder':'Pre Kínder','pre-kinder':'Pre Kínder',
  'kinder':'Kínder','kindergarten':'Kínder'
};
Object.keys(EXTRA_VARIANTS).forEach(k => { if(!CANONICAL_MAP[k]) CANONICAL_MAP[k]=EXTRA_VARIANTS[k]; });

// Cache de niveles ya vistos que no calzan con la lista conocida — asegura que la MISMA
// variante de escritura (normalizada) siempre se mapee al mismo nombre visible, sin duplicar tarjetas.
const seenNivelDisplay = {};
function canonNivel(raw){
  if(!raw) return '';
  const key = normStr(raw);
  if(CANONICAL_MAP[key]) return CANONICAL_MAP[key];
  if(seenNivelDisplay[key]) return seenNivelDisplay[key];
  // Nivel desconocido: usar el texto tal como vino la primera vez, con formato Título
  const display = raw.trim().replace(/\w\S*/g, t => t.charAt(0).toUpperCase()+t.slice(1).toLowerCase());
  seenNivelDisplay[key] = display;
  return display;
}

function parseCSV(text){
  const lines=text.trim().split('\n').filter(l=>l.trim());
  if(lines.length<2)return[];
  const headers=parseRow(lines[0]).map(h=>h.trim().toLowerCase().replace(/\s+/g,' '));
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const vals=parseRow(lines[i]);
    const o={};headers.forEach((h,j)=>o[h]=(vals[j]||'').trim());
    const colegio=o['colegio']||o['nombre colegio']||o['establecimiento']||'';
    const nivelRaw=o['nivel']||o['curso']||'';
    const nivel=canonNivel(nivelRaw);
    const unidad=o['unidad']||'';
    const sesiones=parseFloat((o['sesiones realizadas']||o['sesiones']||'0').replace(',','.'))||0;
    const raw=(o['%logro']||o['% logro']||o['%_logro']||o['logro']||'').replace('%','').replace(',','.').trim();
    // Solo aceptar valores numéricos como logro; ignorar "no observado", texto, etc.
    const logro=(raw===''||isNaN(parseFloat(raw)))?null:parseFloat(raw);
    if(colegio)rows.push({colegio:colegio.trim(),nivel,unidad:unidad.trim(),sesiones,logro});
  }
  return rows;
}

function parseRow(row){
  const r=[];let c='',q=false;
  for(let i=0;i<row.length;i++){
    if(row[i]==='"'){q=!q;}else if(row[i]===','&&!q){r.push(c.replace(/^"|"$/g,''));c='';}else c+=row[i];
  }
  r.push(c.replace(/^"|"$/g,''));return r;
}

function avg(arr){ const v=arr.filter(x=>x!==null&&!isNaN(x)); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
function sum(arr){ return arr.filter(x=>x!==null&&!isNaN(x)).reduce((a,b)=>a+b,0); }
function pct(v,mx){ return Math.min(100,Math.round(v/mx*100)); }
function progColor(p){ return p>=75?'#93C049':p>=50?'#25AFC4':p>=25?'#F28E35':'#D8162D'; }
function pillCls(p){ return p>=75?'pill pill-g':p>=50?'pill pill-t':p>=25?'pill pill-a':'pill pill-r'; }
function fmtPill(v){ if(v===null)return'<span style="color:var(--text3)">—</span>'; const p=Math.round(v); return`<span class="${pillCls(p)}">${v.toFixed(1)}%</span>`; }

function normU(u){
  const m=(u||'').match(/\d/);
  return m?'U'+m[0]:'';
}

// Agrupa sesiones y logros por unidad para un conjunto de rows
function getStats(rows){
  const ses={U1:[],U2:[],U3:[],U4:[]};
  const log={U1:[],U2:[],U3:[],U4:[]};
  rows.forEach(r=>{
    const u=normU(r.unidad);
    if(ses[u]!==undefined){ ses[u].push(r.sesiones); if(r.logro!==null)log[u].push(r.logro); }
  });
  const sesU1=avg(ses.U1), sesU2=avg(ses.U2), sesU3=avg(ses.U3), sesU4=avg(ses.U4);
  // Avance total = suma de los promedios de sesiones de cada unidad (no el promedio mezclado de todas las filas)
  const totalSes = (sesU1||0) + (sesU2||0) + (sesU3||0) + (sesU4||0);
  return{
    sesU1, sesU2, sesU3, sesU4,
    logU1:avg(log.U1), logU2:avg(log.U2), logU3:avg(log.U3), logU4:avg(log.U4),
    nLog:{U1:log.U1.length,U2:log.U2.length,U3:log.U3.length,U4:log.U4.length},
    totalSes: totalSes>0?totalSes:null,
    n:rows.length
  };
}

/* ── Multi-select ── */
function toggleMenu(e){ const m=document.getElementById('msMenu'); m.style.display=m.style.display==='none'?'block':'none'; e.stopPropagation(); }
function applyFilter(){ document.getElementById('msMenu').style.display='none'; render(); }
document.addEventListener('click',e=>{ const m=document.getElementById('msMenu'),b=document.getElementById('msBox'); if(m&&b&&!b.closest('.ms-wrap').contains(e.target)&&m.style.display!=='none'){m.style.display='none';render();} });
function toggleAll(cb){ document.querySelectorAll('#msList input[type=checkbox]').forEach(c=>c.checked=cb.checked); updateLabel(); }
function filterMs(q){ document.querySelectorAll('#msList .ms-item').forEach(el=>{ el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?'flex':'none'; }); }
function getSelected(){ const ch=[...document.querySelectorAll('#msList input:checked')].map(c=>c.value); const all=[...document.querySelectorAll('#msList input')]; return ch.length===all.length?[]:ch; }
function updateLabel(){
  const ch=[...document.querySelectorAll('#msList input:checked')],all=[...document.querySelectorAll('#msList input')],allCb=document.getElementById('msAll');
  if(ch.length===0){allCb.checked=false;allCb.indeterminate=false;document.getElementById('msLabel').textContent='Sin selección';}
  else if(ch.length===all.length){allCb.checked=true;allCb.indeterminate=false;document.getElementById('msLabel').textContent='Todos los colegios';}
  else{allCb.indeterminate=true;allCb.checked=false;document.getElementById('msLabel').textContent=ch.length===1?ch[0].value:ch.length+' colegios';}
}

function populateFilters(){
  colegiosAll=[...new Set(allData.map(r=>r.colegio).filter(Boolean))].sort();
  const list=document.getElementById('msList');
  list.innerHTML='';
  colegiosAll.forEach(c=>{
    const lbl=document.createElement('label');lbl.className='ms-item';
    lbl.innerHTML=`<input type="checkbox" value="${c.replace(/"/g,'&quot;')}" checked onchange="updateLabel();"> ${c}`;
    list.appendChild(lbl);
  });
  document.getElementById('msAll').checked=true;
  const el=document.getElementById('fNivel'),cur=el.value;
  while(el.options.length>1)el.remove(1);
  [...new Set(allData.map(r=>r.nivel).filter(Boolean))].sort(nivelSort).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});
  if([...el.options].map(o=>o.value).includes(cur))el.value=cur;
}

function resetFilters(){ document.querySelectorAll('#msList input').forEach(c=>c.checked=true); document.getElementById('msAll').checked=true; updateLabel(); document.getElementById('fNivel').value=''; render(); }

function getFiltered(){
  const sel=getSelected(),nivel=document.getElementById('fNivel').value;
  return allData.filter(r=>(sel.length===0||sel.includes(r.colegio))&&(!nivel||r.nivel===nivel));
}

function destroyAll(){ Object.keys(charts).forEach(id=>{try{charts[id].destroy();}catch(e){}delete charts[id];}); }
function mkChart(id,type,data,opts){ const el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].destroy();}catch(e){}delete charts[id];}charts[id]=new Chart(el,{type,data,options:opts}); }

async function loadData(){
  document.getElementById('updateTime').textContent='Actualizando...';
  document.getElementById('mainContent').innerHTML=`<div class="loading-wrap"><p>Cargando datos desde Google Sheets...</p><div class="spinner"><span></span><span></span><span></span></div></div>`;
  destroyAll();
  try{
    const res=await fetch(SHEET_URL);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const text=await res.text();
    allData=parseCSV(text);
    if(!allData.length)throw new Error('Sin datos');
    document.getElementById('updateTime').textContent='Actualizado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    populateFilters();
    render();
  }catch(e){
    document.getElementById('updateTime').textContent='Error';
    document.getElementById('mainContent').innerHTML=`<div class="error-wrap"><strong>No se pudieron cargar los datos</strong>Verifica que el Google Sheet esté publicado públicamente.<br><small>${e.message}</small></div>`;
  }
}

function render(){
  destroyAll();
  const rows=getFiltered();
  if(!rows.length){ document.getElementById('mainContent').innerHTML='<div class="loading-wrap"><p>Sin datos para los filtros seleccionados.</p></div>'; return; }

  const sel=getSelected();
  const colegios=(sel.length===0?colegiosAll:sel.slice().sort());
  const niveles=[...new Set(rows.map(r=>r.nivel).filter(Boolean))].sort(nivelSort);

  // Stats globales
  const gs=getStats(rows);
  const totalSesP=gs.totalSes!==null?pct(gs.totalSes,MAX_SES):0;

  // Stats por colegio
  const byC={};
  colegios.forEach(c=>{ const cr=rows.filter(r=>r.colegio===c); if(!cr.length)return; byC[c]=getStats(cr); });
  const cFiltered=colegios.filter(c=>byC[c]);

  // Stats por nivel
  const byN={};
  niveles.forEach(n=>{ byN[n]=getStats(rows.filter(r=>r.nivel===n)); });

  const hN=Math.max(160,niveles.length*42+50);
  const hC=Math.max(160,cFiltered.length*36+50);

  // ¿Hay datos de logro por unidad?
  const hasLog={U1:gs.logU1!==null,U2:gs.logU2!==null,U3:gs.logU3!==null,U4:gs.logU4!==null};

  function miniBar(sp,color){ return`<div class="mini-bar-wrap"><div class="mini-bar-track"><div class="mini-bar-fill" style="width:${sp}%;background:${color||progColor(sp)}"></div></div><span class="mini-bar-pct">${sp}%</span></div>`; }

  // Gráficos de logro por unidad (solo unidades con datos)
  const logroCharts=['U1','U2','U3','U4'].filter(u=>niveles.some(n=>byN[n]['log'+u.charAt(0).toUpperCase()+u.slice(1)]!==null));

  document.getElementById('mainContent').innerHTML=`

    <div class="section-title">Indicadores generales</div>
    <div class="kpi-grid">
      <div class="kpi accent">
        <div class="lbl">Sesiones totales (promedio)</div>
        <div class="val" style="color:${progColor(totalSesP)}">${gs.totalSes!==null?gs.totalSes.toFixed(1):'—'}</div>
        <div class="sub">de ${MAX_SES} sesiones totales</div>
        <div class="prog-track"><div class="prog-fill" style="width:${totalSesP}%;background:${progColor(totalSesP)}"></div></div>
        <div class="prog-lbl"><span style="color:${progColor(totalSesP)};font-weight:600">${totalSesP}% completado</span></div>
      </div>
      ${['U1','U2','U3','U4'].map(u=>{
        const v=gs['log'+u]; const color=U_COLORS[u];
        return`<div class="kpi" style="border-top:3px solid ${color}">
          <div class="lbl">% Logro ${U_LABELS[u]}</div>
          <div class="val" style="color:${v!==null?progColor(Math.round(v)):'var(--text3)'}">${v!==null?v.toFixed(1)+'%':'—'}</div>
          <div class="sub">${gs.nLog[u]} registros con datos</div>
          ${v!==null?`<div class="prog-track"><div class="prog-fill" style="width:${Math.round(v)}%;background:${progColor(Math.round(v))}"></div></div>`:''}
        </div>`;
      }).join('')}
      <div class="kpi">
        <div class="lbl">Total registros</div>
        <div class="val">${rows.length}</div>
        <div class="sub">${cFiltered.length} colegios · ${niveles.length} niveles</div>
      </div>
    </div>

    <div class="semaforo-legend">
      <span><span class="dot" style="background:#93C049"></span>≥ 75%</span>
      <span><span class="dot" style="background:#25AFC4"></span>50 – 74%</span>
      <span><span class="dot" style="background:#F28E35"></span>25 – 49%</span>
      <span><span class="dot" style="background:#D8162D"></span>< 25%</span>
    </div>

    <!-- GRÁFICO SESIONES APILADO POR UNIDAD -->
    <div class="section-title">Avance de sesiones por nivel</div>
    <div class="card" style="margin-bottom:20px">
      <h3>Sesiones realizadas por nivel — apiladas por unidad</h3>
      <div class="legend">
        <span><span class="sq" style="background:${U_COLORS.U1}"></span>Unidad 1</span>
        <span><span class="sq" style="background:${U_COLORS.U2}"></span>Unidad 2</span>
        <span><span class="sq" style="background:${U_COLORS.U3}"></span>Unidad 3</span>
        <span><span class="sq" style="background:${U_COLORS.U4}"></span>Unidad 4</span>
        <span><span class="sq" style="background:#e0efec"></span>Pendiente</span>
      </div>
      <div style="position:relative;height:${hN}px"><canvas id="cSesN" role="img" aria-label="Sesiones apiladas por unidad y nivel"></canvas></div>
    </div>

    <!-- GRÁFICOS DE LOGRO POR UNIDAD -->
    ${logroCharts.length>0?`
    <div class="section-title">% Logro por unidad y nivel</div>
    <div class="logro-charts">
      ${logroCharts.map(u=>`
        <div class="card">
          <h3 style="color:${U_COLORS[u]}">${U_LABELS[u]} — % Logro por nivel</h3>
          <div style="position:relative;height:${hN}px"><canvas id="cLog${u}" role="img" aria-label="Logro ${u} por nivel"></canvas></div>
        </div>`).join('')}
    </div>`:''}

    <!-- TARJETAS POR NIVEL -->
    <div class="section-title">Detalle por nivel</div>
    <div class="nivel-grid">
      ${niveles.map(n=>{
        const d=byN[n];
        const sp=d.totalSes!==null?pct(d.totalSes,MAX_SES):0; const sc=progColor(sp);
        const us=['U1','U2','U3','U4'];
        const sesParts=us.map(u=>d['ses'+u]!==null?d['ses'+u]:0);
        const totalAcum=sesParts.reduce((a,b)=>a+b,0);
        return`<div class="nivel-card">
          <div class="nivel-top"><span class="nivel-name">${n}</span><span class="nivel-n">${d.n} reg.</span></div>
          <div style="font-size:11px;color:var(--text2);margin-bottom:4px">Sesiones totales: <strong style="color:${sc}">${d.totalSes!==null?d.totalSes.toFixed(1):'—'} / ${MAX_SES}</strong></div>
          <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--bg3)">
            ${us.map((u,i)=>sesParts[i]>0?`<div style="width:${Math.min(100,pct(sesParts[i],MAX_SES))}%;background:${U_COLORS[u]};height:6px"></div>`:``).join('')}
          </div>
          <div class="prog-lbl"><span style="color:${sc};font-weight:600">${sp}%</span><span>${MAX_SES}</span></div>
          ${us.map(u=>d['ses'+u]!==null&&d['ses'+u]>0?`<div class="nivel-row" style="margin-top:2px"><span style="color:${U_COLORS[u]}">● ${U_LABELS[u]}</span><span>${d['ses'+u].toFixed(1)} ses.</span></div>`:``).join('')}
          ${d.logU1!==null?`<div class="nivel-row" style="border-top:0.5px solid var(--border);margin-top:6px;padding-top:4px"><span>% Logro U1</span><strong style="color:${progColor(Math.round(d.logU1))}">${d.logU1.toFixed(1)}%</strong></div>`:''}
          ${d.logU2!==null?`<div class="nivel-row"><span>% Logro U2</span><strong style="color:${progColor(Math.round(d.logU2))}">${d.logU2.toFixed(1)}%</strong></div>`:''}
          ${d.logU3!==null?`<div class="nivel-row"><span>% Logro U3</span><strong style="color:${progColor(Math.round(d.logU3))}">${d.logU3.toFixed(1)}%</strong></div>`:''}
          ${d.logU4!==null?`<div class="nivel-row"><span>% Logro U4</span><strong style="color:${progColor(Math.round(d.logU4))}">${d.logU4.toFixed(1)}%</strong></div>`:''}
        </div>`;
      }).join('')}
    </div>

    <!-- GRÁFICO COLEGIOS -->
    <div class="section-title">Comparativo por colegio</div>
    <div class="card" style="margin-bottom:20px">
      <h3>Sesiones realizadas por colegio — apiladas por unidad</h3>
      <div class="legend">
        <span><span class="sq" style="background:${U_COLORS.U1}"></span>U1</span>
        <span><span class="sq" style="background:${U_COLORS.U2}"></span>U2</span>
        <span><span class="sq" style="background:${U_COLORS.U3}"></span>U3</span>
        <span><span class="sq" style="background:${U_COLORS.U4}"></span>U4</span>
        <span><span class="sq" style="background:#e0efec"></span>Pendiente</span>
      </div>
      <div style="position:relative;height:${hC}px"><canvas id="cSesC" role="img" aria-label="Sesiones por colegio apiladas por unidad"></canvas></div>
    </div>

    <!-- TABLA -->
    <div class="section-title">Tabla de avance y logros por colegio</div>
    <div class="card" style="margin-bottom:20px;overflow-x:auto">
      <table class="tbl">
        <thead><tr>
          <th>Colegio</th>
          <th>Ses. U1</th><th>Ses. U2</th><th>Ses. U3</th><th>Ses. U4</th>
          <th>Total ses.</th><th>Avance</th>
          <th>% Logro U1</th><th>% Logro U2</th><th>% Logro U3</th><th>% Logro U4</th>
          <th>Reg.</th>
        </tr></thead>
        <tbody>
          ${cFiltered.map(c=>{
            const d=byC[c]; const sp=d.totalSes!==null?pct(d.totalSes,MAX_SES):0;
            const fmtSes=v=>v!==null?v.toFixed(1):'—';
            return`<tr>
              <td style="font-weight:500">${c}</td>
              <td style="color:${U_COLORS.U1}">${fmtSes(d.sesU1)}</td>
              <td style="color:${U_COLORS.U2}">${fmtSes(d.sesU2)}</td>
              <td style="color:${U_COLORS.U3}">${fmtSes(d.sesU3)}</td>
              <td style="color:${U_COLORS.U4}">${fmtSes(d.sesU4)}</td>
              <td style="color:var(--text2)">${d.totalSes!==null?d.totalSes.toFixed(1)+' / '+MAX_SES:'—'}</td>
              <td>${miniBar(sp)}</td>
              <td>${fmtPill(d.logU1)}</td><td>${fmtPill(d.logU2)}</td><td>${fmtPill(d.logU3)}</td><td>${fmtPill(d.logU4)}</td>
              <td style="color:var(--text3)">${d.n}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  // Sesiones apiladas por nivel
  const uKeys=['U1','U2','U3','U4'];
  const sesByU=uKeys.map(u=>niveles.map(n=>byN[n]['ses'+u]!==null?+byN[n]['ses'+u].toFixed(1):0));
  const totalByNivel=niveles.map((_,i)=>sesByU.reduce((s,arr)=>s+arr[i],0));
  const pendByNivel=totalByNivel.map(t=>Math.max(0,MAX_SES-t));
  const datasets=[
    ...uKeys.map((u,i)=>({label:U_LABELS[u],data:sesByU[i],backgroundColor:U_COLORS[u],borderRadius:i===0?3:0})),
    {label:'Pendiente',data:pendByNivel,backgroundColor:'#e0efec',borderRadius:3}
  ];
  mkChart('cSesN','bar',{labels:niveles,datasets},{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,max:MAX_SES,ticks:{stepSize:5}},y:{stacked:true,ticks:{font:{size:11}}}}});

  // Logro por unidad (gráficos separados)
  logroCharts.forEach(u=>{
    const logKey='log'+u;
    const data=niveles.map(n=>byN[n][logKey]!==null?+byN[n][logKey].toFixed(1):null);
    mkChart('cLog'+u,'bar',{labels:niveles,datasets:[{label:'% Logro',data,backgroundColor:data.map(v=>v===null?'#eee':progColor(Math.round(v))),borderRadius:3}]},{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'}},y:{ticks:{font:{size:11}}}}});
  });

  // Sesiones apiladas por colegio
  const sesByUC=uKeys.map(u=>cFiltered.map(c=>byC[c]['ses'+u]!==null?+byC[c]['ses'+u].toFixed(1):0));
  const totalByC=cFiltered.map((_,i)=>sesByUC.reduce((s,arr)=>s+arr[i],0));
  const pendByC=totalByC.map(t=>Math.max(0,MAX_SES-t));
  const datasetsC=[
    ...uKeys.map((u,i)=>({label:U_LABELS[u],data:sesByUC[i],backgroundColor:U_COLORS[u],borderRadius:i===0?3:0})),
    {label:'Pendiente',data:pendByC,backgroundColor:'#e0efec',borderRadius:3}
  ];
  mkChart('cSesC','bar',{labels:cFiltered,datasets:datasetsC},{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,max:MAX_SES,ticks:{stepSize:5}},y:{stacked:true,ticks:{font:{size:10}}}}});
}

loadData();
</script>
</body>
</html>
